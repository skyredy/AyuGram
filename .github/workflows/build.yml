name: AyuGram CI

on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      # Bazel's disk cache lives outside the checkout so it survives across runs/branches.
      # The restore key is intentionally unique (never matches) so it always falls through to
      # restore-keys and picks up the most recent snapshot; the save step below then always
      # succeeds in writing a new snapshot (cache keys are immutable, so re-using a key would fail).
      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: /Users/Shared/bazel-disk-cache
          key: bazel-disk-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bazel-disk-cache-${{ runner.os }}-

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/ayugram-ios

      # api_id/api_hash come from repo secrets and are only ever materialized into this
      # gitignored .local.json on the runner's disk - never committed to the repository.
      - name: Write build configuration from secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -x
          cd /Users/Shared/ayugram-ios
          python3 - <<'PYEOF'
          import json, os

          with open('build-system/ayugram-configuration.json') as f:
              config = json.load(f)

          config['api_id'] = os.environ['TELEGRAM_API_ID']
          config['api_hash'] = os.environ['TELEGRAM_API_HASH']

          with open('build-system/ayugram-configuration.local.json', 'w') as f:
              json.dump(config, f, indent=2)
          PYEOF

      - name: Build the App
        id: build_step
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/ayugram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir=/Users/Shared/bazel-disk-cache \
            build \
            --configurationPath="build-system/ayugram-configuration.local.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          cp bazel-bin/Telegram/Telegram.ipa $OUTPUT_PATH/AyuGram.ipa

          # collect dsym
          mkdir -p build/DSYMs
          for f in bazel-bin/Telegram/*.dSYM; do
            cp -R "$f" build/DSYMs/
          done
          zip -r "./$OUTPUT_PATH/AyuGram.DSYMs.zip" build/DSYMs 1>/dev/null

      # Runs even if the build step above failed partway through, so whatever Bazel already
      # finished (e.g. 4100 of 5000 actions) is kept for the next run instead of starting over.
      - name: Save Bazel disk cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /Users/Shared/bazel-disk-cache
          key: bazel-disk-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            /Users/Shared/ayugram-ios/build/artifacts/AyuGram.ipa
            /Users/Shared/ayugram-ios/build/artifacts/AyuGram.DSYMs.zip
          retention-days: 30
